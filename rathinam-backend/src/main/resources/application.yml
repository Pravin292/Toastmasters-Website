spring:
  application:
    name: rathinam-backend
  profiles:
    active: dev
  jpa:
    open-in-view: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

ai:
  provider: gemini
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: gemini-1.5-flash
    timeout-seconds: 10

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:5173}

